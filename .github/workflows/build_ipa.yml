name: Build Gallery App (Android)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "admin_app/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/publish_admin_app.yml"

permissions:
  contents: write

jobs:
  # Fast parallel Android build on Ubuntu Linux (runs in 2-3 minutes)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-

      - name: Install dependencies
        run: flutter pub get

      - name: Create private OAuth build configuration
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os

          required = (
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_REFRESH_TOKEN",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing required GitHub Actions secrets: " + ", ".join(missing)
              )

          values = {
              name: os.environ[name]
              for name in required
          }
          with open("oauth_secrets.json", "w", encoding="utf-8") as output:
              json.dump(values, output)
          PY
          chmod 600 oauth_secrets.json

      - name: Validate Android OAuth credentials
        run: python3 scripts/validate_oauth_config.py oauth_secrets.json

      - name: Build Android APK
        run: |
          chmod +x scripts/build_android_apk.sh
          ./scripts/build_android_apk.sh

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Android-APK
          path: build/Gallery.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### Gallery App

          - Apple Photos VisionOS & Glassmorphism UI
          - Automatic Google Drive background backup & sync

          ---

          ### 📥 Direct Downloads

          - **Android APK**: [Gallery.apk](https://github.com/BalbirSinghBisht/scanner/releases/download/latest/Gallery.apk)
          ---

          #### 📱 How to install on Android:
          1. Download `Gallery.apk` on your phone.
          2. Tap the downloaded file to install (allow install from browser if prompted).

          EOF

          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Gallery (Android)" --notes-file release_notes.md
            gh release upload latest build/Gallery.apk --clobber
          else
            gh release create latest build/Gallery.apk --title "Gallery (Android)" --notes-file release_notes.md
          fi

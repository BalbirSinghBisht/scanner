name: scanner
description: "Automatic Phone Media Backup to Google Drive"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Google OAuth & Drive API
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2

  # Media Scanning & Permissions
  photo_manager: ^3.7.0
  permission_handler: ^11.3.1

  # Local Persistence & Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Network & Device State
  connectivity_plus: ^6.1.3
  battery_plus: ^6.2.1

  # State Management & Utilities
  provider: ^6.1.2
  crypto: ^3.0.6
  intl: ^0.19.0
  googleapis_auth: ^2.3.5
  device_info_plus: ^12.4.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.2
  video_player: ^2.14.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
